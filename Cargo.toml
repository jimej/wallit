about = "wallet for secrets"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = {version = "4.4.18", features =["derive"] }  # "cargo"
aes-gcm-siv = "0.11.1"
